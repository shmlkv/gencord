name: ADV app-only build and tests
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated build bootstrap
        run: python -m pip install uv
      - name: Host behavior suites (synthetic hardware)
        run: |
          mkdir -p .build-tools/tmp
          python3 tests/run_host.py
      - name: Receiver HTTP and PCM fixture tests
        working-directory: receiver
        run: python3 -m unittest -q test_receiver
      - name: Build app only (never flash or merge)
        run: |
          test ! -f src/config.h
          bash tools/build_firmware.sh
          test -s gencord-adv-app.bin
      - uses: actions/upload-artifact@v4
        with:
          name: gencord-adv-app-only
          path: gencord-adv-app.bin
          if-no-files-found: error
