; gencord ADV USB-only stereo recorder (StampS3 / StampS3A, runtime board detect)
[platformio]
default_envs = adv-idf54
; Records WAV to microSD, uploads to Synology (WebDAV) when on home Wi-Fi.

[env:cardputer]
; Arduino 3.2 / ESP-IDF 5.4: with IDF 5.5.x the Cardputer PDM mic only delivers a flat line (M5Cardputer#11)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
extra_scripts = post:tools/copy_bin.py
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    -Wl,--wrap=usb_dwc_hal_set_fifo_bias
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; Kconfig of the vendored lib/usb_host_uac (DJI receiver on USB-C)
    -DCONFIG_UAC_DEV_ADDR_LIST_MAX=6
    -DCONFIG_UAC_FREQ_NUM_MAX=8
    -DCONFIG_UAC_NUM_ISOC_URBS=3
    -DCONFIG_UAC_NUM_PACKETS_PER_URB=3
    -DCONFIG_UAC_RINGBUF_SAFE_DELETE_WAITING_MS=50
    -DUSB_HOST_UAC_VER_MAJOR=1 -DUSB_HOST_UAC_VER_MINOR=5 -DUSB_HOST_UAC_VER_PATCH=0
lib_deps =
    m5stack/M5Cardputer @ 1.1.1
    m5stack/M5Unified @ 0.3.0
    m5stack/M5GFX @ 0.3.0
    arduino-irremote/IRremote @ 4.7.1

; Same firmware on Arduino 3.2 / ESP-IDF 5.4 (Cardputer PDM mic regression on IDF 5.5.x, see M5Cardputer#11)
[env:idf54]
extends = env:cardputer
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip

; The bundled esptool requires click<8.2; tools/build_firmware.sh pins that.
; New esptool 5.3 registry archives are installer stubs, not drop-in script packages.

[env:adv-idf54]
extends = env:idf54
; Partition CSV is a linker size budget ONLY, not the installed custom layout.
; Never flash its table/bootloader/merged image.
extra_scripts = post:tools/copy_bin.py

